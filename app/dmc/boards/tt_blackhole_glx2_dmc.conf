# GLX2 board does not have max6639 fan controller, so disable MFD and PWM
CONFIG_MFD=n
CONFIG_PWM=n

CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"

# Shell over RTT. The board defconfig already enables RTT and the RTT console.
# Same recipe as app/smc/sysbuild/dmc_i2c_shell.conf.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=128
CONFIG_SEGGER_RTT_SECTION_NONE=y
# Send logs through the shell; do not run a second RTT log backend on channel 0
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
