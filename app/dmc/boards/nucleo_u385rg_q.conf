# Nucleo U385RG-Q: mirror native_sim DMC setup with emulated BH ARC plumbing.
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_GPIO_EMUL=y
CONFIG_SPI=y
CONFIG_SPI_EMUL=y

# SMBus support
CONFIG_SMBUS=y
CONFIG_SMBUS_EMUL=y
CONFIG_I2C_TARGET=y
CONFIG_SMBUS_TARGET=y
CONFIG_CRC=y

# Use real bh_arc command path
CONFIG_TT_BH_ARC=y
CONFIG_TT_BH_ARC_EMUL=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_EMUL=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_WATCHDOG=y
CONFIG_WDT_TT_BH=y

# Keep console/shell on the board's default UART routing.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
# CONFIG_LOG_BACKEND_RINGBUF=n

# Shell over RTT as well, to mock the GLX2 DMC (see tt_blackhole_glx2_dmc.conf).
# The Nucleo board defconfig does not enable RTT, so turn it on here.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=3072
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=128
CONFIG_SEGGER_RTT_SECTION_NONE=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y

CONFIG_TT_BIST=n
