# Zephyr's SMBus shell, for driving SMBus protocols by hand at the terminal:
# `smbus scan`, `smbus quick`, `smbus byte_data_read`, `smbus block_read`, and
# the rest. It is a bench aid and an independent second implementation of the
# same frames `bulk` produces, which makes it useful for cross-checking a
# capture. Host tooling does not use it, and should not:
#
#  - `smbus block_read` prints the payload with the count byte stripped and
#    never reads a PEC byte, which are the two bytes a host needs in order to
#    check the framing itself;
#  - its receive buffer is uint8_t buf[32] while the driver will write up to
#    the 255 bytes a target may announce, and the bounds check runs after the
#    copy;
#  - `block_write` inserts the count byte itself, so an already-framed payload
#    would carry two.
#
# The SMBus device wraps the same controller as the i2c node it names, and each
# transaction takes that controller's mutex, so `smbus`, `i2c` and `bulk`
# commands interleave safely.
CONFIG_SMBUS=y
CONFIG_SMBUS_SHELL=y

# I2C initialises at POST_KERNEL/50 and so, by default, does SMBus. The
# devicetree phandle already orders them, but production app/dmc sets 60 for
# exactly this reason; follow it rather than rely on the tie-break.
CONFIG_SMBUS_INIT_PRIORITY=60

# CONFIG_SMBUS_STM32_SMBALERT is deliberately left at its default of y, even
# though nothing here uses the alert line: it is only ever armed by
# smbus_configure(SMBUS_MODE_SMBALERT), which the shell never calls, and this
# board's devicetree routes no SMBA pin (the U3 pinctrl does have
# i2c1_smba_pb5, i2c2_smba_pb12 and i2c3_smba_pb2 if that ever changes).
#
# Setting it to n does not build in the Zephyr revision west.yml pins.
# smbus_stm32_configure() calls i2c_stm32_smbalert_enable()/_disable()
# unconditionally (drivers/smbus/smbus_stm32.c), while their declarations in
# include/zephyr/drivers/i2c/stm32.h sit behind #ifdef
# CONFIG_SMBUS_STM32_SMBALERT -- so with SMBUS_STM32=y and SMBALERT=n the
# compiler sees implicit declarations and -Werror stops the build. The
# definitions themselves are compiled (i2c_stm32.c guards them on
# CONFIG_SMBUS_STM32), so this is a missing-guard bug upstream rather than a
# real dependency. Leaving it on costs a stored callback pointer and one
# branch in the shared I2C error ISR.

# Console and shell backends.
#
# These moved out of prj.conf when tt_blackhole_glx2_dmc became a second target.
# None of it is shared: that board has no bring-up UART and consoles over RTT on
# the SWD path. See boards/tt_blackhole_glx2_dmc.conf for its half.

# uart4, out through the board FTDI as /dev/ttyUSBx.
CONFIG_UART_CONSOLE=y
CONFIG_SHELL_BACKEND_SERIAL=y

# The serial backend's ring buffers, sized against prj.conf's
# CONFIG_SHELL_CMD_BUFF_SIZE=2304:
#
#   RX_RING 2304  -> the default is 64, which is smaller than one bulk command
#                    line. Over the FTDI at 115200 a 2 KB line arrives spread
#                    over ~180 ms and the shell thread keeps up regardless; over
#                    USB the host delivers it as a burst and the ring is what
#                    has to absorb it.
#   TX_RING 512   -> default 8. A `RX 1024 <hex>` reply is ~2 KB, and this is
#                    how much of it goes out per interrupt.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2304
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512

# USB device: this board's USB-C port goes straight to the STM32 (PA11/PA12), so
# expose it as a CDC ACM serial port and run a second shell on it. The UART shell
# on uart4 is untouched -- both work at once, see usb_shell.c, which is guarded
# on DT_NODE_HAS_STATUS_OKAY() of the cdc-acm node and so compiles out entirely
# on a board that has none.
#
# INITIALIZE_AT_BOOT builds the whole USBD context (descriptors, configuration,
# usbd_init + usbd_enable) around the first zephyr,cdc-acm-uart under
# zephyr_udc0, so the app needs no USB setup code of its own.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="MK DMC shell"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Tenstorrent"
CONFIG_UART_LINE_CTRL=y

# This app runs the whole log subsystem at DBG. Left there, USB enumeration alone
# emits hundreds of lines per plug-in over the 115200 console, which is slow
# enough to disturb the enumeration it is reporting on. Pin the USB modules to
# warnings so real faults still show up.
#
# UDC_DRIVER matters as much as the other two: udc_stm32.c logs "DataIn ep 0x%02x"
# at DBG on *every* IN transfer, and the console is uart4 -- which is also the
# shell backend. Left at DBG, driving the USB shell sprays log lines into the
# FTDI shell's replies, where a partial line ("ataIn ep 0x80") does not match the
# host's log-line filter and lands inside a command's output instead.
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# I3C, as a controller, plus OCCP over it.
#
# Moved out of prj.conf alongside the console: tt_blackhole_glx2_dmc opts out of
# I3C entirely, and leaving these shared would make every one of them invisible
# -- and so warned about -- on that build. The nucleo keeps its own copy in
# boards/nucleo_u385rg_q.conf.
#
# The app binds whichever instance the devicetree selects (0d7791df): main.c
# picks i3c2 when its `target-mode` property is set, i3c1 otherwise. The
# mk_i3c_{controller,dual,target}.overlay files at the app root switch between
# those roles and are passed explicitly with EXTRA_DTC_OVERLAY_FILE -- they are
# not board-named, so nothing auto-discovers them.
CONFIG_I3C=y
CONFIG_I3C_DUAL_ROLE=y
CONFIG_I3C_USE_IBI=n
CONFIG_I3C_SHELL=y
CONFIG_OCCP=y
CONFIG_OCCP_BACKEND_I3C=y

# I3C at DBG: this is the bus under bring-up on this board, so its traffic is
# the point rather than noise.
CONFIG_I3C_LOG_LEVEL_DBG=y
CONFIG_I3C_STM32_LOG_LEVEL_DBG=y
