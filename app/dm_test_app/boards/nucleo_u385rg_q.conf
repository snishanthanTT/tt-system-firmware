# Mirror of boards/tt_blackhole_glx2_dmc.conf, so that a rehearsal on this
# Nucleo exercises the same Kconfig surface the CMB build will. Read that file
# alongside this one -- its comments carry the reasoning, and this file notes
# only where the Nucleo has to differ.

# Shell over RTT. On the CMB this is the only console there is; here it is the
# one that matters, because boardy reaches the board through the pty that
# `boardy-rtt` serves off this channel.
#
# The Nucleo board defconfig does not enable RTT (the GLX2 board defconfig
# does), so unlike the CMB's .conf this one has to turn it on and size both
# buffers itself.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_SECTION_NONE=y
CONFIG_SHELL_BACKEND_RTT=y

# OFF, matching the CMB -- and this one is load-bearing, not tidiness.
#
# This board has an ST-Link VCP on lpuart1 that the CMB has no equivalent of,
# so leaving the serial backend on gave a second, independent console: handy on
# a stand-in board. It also made this the ONLY one of the three dm_test_app
# board targets running TWO shell backends at once:
#
#   nucleo (before)  SHELL_BACKEND_SERIAL=y  SHELL_BACKEND_RTT=y   <- two
#   tt_blackhole_glx2_dmc  =n  RTT=y                               <- one
#   tt_grendel_mk_bu_dmc   =y  (no RTT)                            <- one
#
# With CONFIG_SHELL_LOG_BACKEND=y each shell instance carries its own log
# backend, so every debug line is dispatched twice. On the bench this board
# panicked into arch_system_halt a second or two after `i2c speed` -- a
# software panic, CFSR/HFSR both zero, with the stale frames on PSP all in the
# log pipeline (cbprintf_package_convert, mpsc_pbuf_commit). MK sends the same
# `i2c speed` from boardy every day on one backend and does not do this.
#
# That makes the dual backend the prime suspect and this line the experiment:
# if the panic survives SHELL_BACKEND_SERIAL=n, the dual shell was not the
# cause and the CMB -- which has only ever had one -- is exposed too.
CONFIG_SHELL_BACKEND_SERIAL=n

# Logs through the shell rather than a second RTT backend on the same channel,
# which would interleave log lines into command replies. Same as the CMB.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL_LOG_BACKEND=y

# Sized for the `bulk` commands, matching the CMB exactly: one bulk line carries
# up to 1024 payload bytes as 2048 hex characters, against
# CONFIG_SHELL_CMD_BUFF_SIZE=2304 in prj.conf, and the down buffer is what that
# line has to fit through on the way in. The up buffer covers the ~2 KB reply to
# a 1024-byte read.
#
# The CMB only sets the down buffer because its board defconfig already provides
# 3072 up; this board has no such defconfig, so both are stated here.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=3072
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=2304

# Zephyr's SMBus shell, for driving SMBus protocols by hand and as an
# independent second implementation of the frames `bulk` produces -- which is
# what makes it useful for cross-checking a capture. Host tooling does not use
# it, and should not.
#
# This is the half of the CMB's configuration the Nucleo was missing entirely,
# and without it the smbus1/2/3 nodes in the overlay bind nothing.
CONFIG_SMBUS=y
CONFIG_SMBUS_SHELL=y

# I2C initialises at POST_KERNEL/50 and so, by default, does SMBus. The
# devicetree phandle already orders them, but the CMB sets 60 for exactly this
# reason; follow it rather than rely on the tie-break.
CONFIG_SMBUS_INIT_PRIORITY=60

# No I3C, deliberately, and this is a change in intent rather than a tidy-up.
#
# This file used to set CONFIG_I3C, CONFIG_I3C_DUAL_ROLE, CONFIG_I3C_SHELL,
# CONFIG_OCCP and CONFIG_OCCP_BACKEND_I3C, with the matching i3c1/i3c2 nodes in
# the overlay -- inherited from app/dmc's nucleo config, where mocking the GLX2
# DMC's I3C target role was the point.
#
# It is removed because the GLX2 *CMB* build has no I3C at all. Its .conf says
# so in as many words: the CMB's i3c1 is a target answering a tray BMC that is
# not present on a bare board, so the dm_test_app build does not opt in. Running
# I3C here rehearsed a bus the CMB never drives, and it cost the three it does
# -- i3c1's PB2 is i2c3's SMBA and i3c2's PB10 is i2c2's SCL on this package.
#
# It also removes CONFIG_I3C_LOG_LEVEL_DBG and CONFIG_I3C_STM32_LOG_LEVEL_DBG,
# which produced a per-boot storm of "No response to broadcast address" and
# "RSTDAA error (-5)" -- every line of it routed by CONFIG_SHELL_LOG_BACKEND
# through the same RTT channel the shell reads commands on. A bench hang where
# the shell stopped consuming its RTT down-buffer (20 bytes left unread while
# the core kept running) is unexplained and may be unrelated, but this was the
# loudest thing on that channel and is now gone.
#
# Add CONFIG_I3C=y + CONFIG_I3C_SHELL=y back here if the Nucleo is ever needed
# to mock the tray-BMC side again -- but not in the same build as a faithful
# i2c2/i2c3, because the pads collide.
