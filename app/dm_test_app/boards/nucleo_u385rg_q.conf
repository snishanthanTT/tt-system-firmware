# Nucleo U385: OCCP target emulator on i3c1 (Binho controller -> Nucleo target bench).
# Merged on top of prj.conf for every nucleo_u385rg_q build of this app.
CONFIG_DM_TEST_APP_OCCP_TARGET=y
CONFIG_DM_TEST_APP_OCCP_TARGET_LOG_LEVEL_INF=y

# The ported ROM read handler keeps a 2 KB response packet in .bss, but the
# ROM loop and Zephyr logging still need more than the 1 KB default.
CONFIG_MAIN_STACK_SIZE=8192

# The stock prj.conf runs the I3C drivers at DBG. That is hundreds of log
# lines per transaction on a 115200 console, and the OCCP reply must be in the
# TX FIFO within the host's 1 ms budget. Keep the driver quiet on this bench.
CONFIG_I3C_LOG_LEVEL_WRN=y
CONFIG_I3C_STM32_LOG_LEVEL_WRN=y
