# Shell over RTT, which is this board's console. The GLX2 CMB reaches the DMC
# through the SWD path on the J231 edge connector, and the board defconfig
# already sets CONFIG_USE_SEGGER_RTT and CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=3072.
# uart4 and uart5 are `okay` in the board devicetree, but neither is the
# bring-up access path, so the serial shell backend goes away entirely.
#
# SHELL_BACKEND_RTT selects CONSOLE, RTT_CONSOLE and SEGGER_RTT_CUSTOM_LOCKING,
# so none of those is repeated here. It also `depends on !(SHELL_LOG_BACKEND &&
# LOG_MODE_IMMEDIATE)` -- the RTT backend can only be called from thread
# context -- which is why the deferred log mode that prj.conf leaves at its
# default has to stay that way.
#
# Same recipe as app/dmc/boards/tt_blackhole_glx2_dmc.conf (9610b75c) and
# app/smc/sysbuild/dmc_i2c_shell.conf, with one deliberate difference: the down
# buffer, below.
#
# CONFIG_SHELL_PROMPT_RTT is deliberately left at its default of "rtt:~$ ".
# boardy anchors on the prompt *tail* (`PROMPT = ":~$"` in
# transports/dmc_shell.py, matched after `[\w.\-]*`), so "rtt" is absorbed by
# the same pattern that absorbs "uart" and "dm_test_app". Overriding it here
# would buy nothing and break the one thing 60f971e2 set out to fix.
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SEGGER_RTT_SECTION_NONE=y

# Send logs through the shell instead of running a second RTT log backend on
# the same channel, which would interleave log lines into command replies.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL_LOG_BACKEND=y

# The one number that must NOT be copied from the production app's recipe.
#
# app/dmc sets this to 128, which is ample for a shell that only ever sees
# `i2c` and `gpio` commands. This app sets CONFIG_SHELL_CMD_BUFF_SIZE=2304
# because one `bulk` line carries up to 1024 payload bytes as 2048 hex
# characters, and the down buffer is what the host's command line has to fit
# through on its way in. At 128 every bulk command would be truncated
# mid-payload, which the shell reports as a parse error rather than as an
# overflow -- the confusing failure, not the obvious one.
#
# The up buffer is already 3072 in the board defconfig, which covers the
# ~2 KB reply to a 1024-byte read.
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=2304

# No I3C, and nothing to write for it: I3C and OCCP are opt-in per board, so
# this file simply does not opt in. (boards/tt_grendel_mk_bu_dmc.conf and
# boards/nucleo_u385rg_q.conf do.)
#
# Why opt out. This board's i3c1 is `target-mode` with mipi-instance = <0>: the
# DMC answers a tray BMC across the B2B connector, and on a bare CMB there is
# no controller on the other end to answer. Zephyr's `i3c` shell is a
# controller-side tool, so it would buy nothing here either. Add
# CONFIG_I3C=y + CONFIG_I3C_SHELL=y here if a tray ever appears on the bench.

# Zephyr's SMBus shell, for driving SMBus protocols by hand at the terminal and
# as an independent second implementation of the frames `bulk` produces, which
# is what makes it useful for cross-checking a capture. Host tooling does not
# use it, and should not -- see the long rationale in
# boards/tt_grendel_mk_bu_dmc.conf, which applies verbatim.
CONFIG_SMBUS=y
CONFIG_SMBUS_SHELL=y

# I2C initialises at POST_KERNEL/50 and so, by default, does SMBus. The
# devicetree phandle already orders them, but production app/dmc sets 60 for
# exactly this reason; follow it rather than rely on the tie-break.
CONFIG_SMBUS_INIT_PRIORITY=60

# CONFIG_SMBUS_STM32_SMBALERT stays at its default of y, but NOT for the reason
# it does on MK. The MK comment turns on that board routing no SMBA pin; this
# board routes all three (i2c1_smba_pb5, i2c2_smba_pb12, i2c3_smba_pb2 are all
# in the board devicetree's pinctrl-0 groups), so the alert line is real here.
#
# It still is not reachable as a *fault* path: PMBUS_ALERT_Z is wired-OR from
# all eight VRs but goes to the ASIC's PMBus SMBA input and to the B2B, never to
# the DMC. And U271's THERM/ALERT wiring means the temperature sensor cannot
# raise an SMBus alert on this board either. So nothing arms it in practice --
# smbus_configure(SMBUS_MODE_SMBALERT) is never called by the shell.
#
# Setting it to n does not build in the Zephyr revision west.yml pins:
# smbus_stm32_configure() calls i2c_stm32_smbalert_enable()/_disable()
# unconditionally (drivers/smbus/smbus_stm32.c) while their declarations in
# include/zephyr/drivers/i2c/stm32.h sit behind #ifdef
# CONFIG_SMBUS_STM32_SMBALERT, so -Werror stops the build on the implicit
# declarations. That is a missing-guard bug upstream, not a real dependency.
