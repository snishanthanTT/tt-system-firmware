# Driver configuration
#
# I3C and OCCP are per-board, in boards/<board>.conf. MK and the nucleo drive
# the bus as a controller; tt_blackhole_glx2_dmc's i3c1 is target-mode with no
# controller on the other end of a bare CMB, so it opts out.
#
# Enabling them here and switching them off per board is NOT equivalent: every
# I3C-dependent symbol (I3C_SHELL, I3C_DUAL_ROLE, the two I3C log levels,
# OCCP_BACKEND_I3C) goes invisible on a board with I3C off, and Kconfig warns
# once per assignment. Opt-in keeps every build quiet.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_FLASH=y

# Debug Configuration
CONFIG_DEBUG=y

# Disable watchdog for debugging
CONFIG_WATCHDOG=n

# Logging
#
# The console *backend* is per-board and lives in boards/<board>.conf, because
# the boards do not agree: MK consoles on uart4 through the board FTDI, while
# tt_blackhole_glx2_dmc has no bring-up UART and consoles over RTT on the SWD
# path. CONFIG_CONSOLE and CONFIG_SERIAL are shared -- both boards have real
# UARTs in their devicetrees -- but UART_CONSOLE is not.
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_KERNEL_LOG_LEVEL_OFF=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BUFFER_SIZE=32768

# create build/zephyr/zephyr.lst
CONFIG_OUTPUT_DISASSEMBLY=y

# Shell configuration
#
# The backend is per-board, in boards/<board>.conf: serial plus a second shell
# on USB CDC for MK, RTT for tt_blackhole_glx2_dmc.
CONFIG_SHELL=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HELP=y

# History off. Not for the RAM -- 512 bytes per instance is nothing on a 256 KB
# part -- but because at the command lengths below it stores nothing useful: one
# `bulk` line is up to ~2 KB, so a 512-byte heap holds zero of them and evicts
# the short commands that were in there. Costs up-arrow recall on the
# interactive FTDI shell; delete this line to get it back.
CONFIG_SHELL_HISTORY=n

# Transfer sizing. Upstream's i2c/i3c/spi shells spend one argv token per
# payload byte, so ARGC_MAX -- not the bus, and not the driver buffer -- is what
# caps a transfer: at the stock 20 that is 15 bytes for `i2c write` and 17 for
# `spi transceive`. boardy measured the wall from the other side and pinned
# DMCShellSPI.SAFE_FRAME_BYTES at 14 to stay clear of it.
#
# These two raise the tokenised path (src/bulk_shell.c then removes the per-byte
# encoding entirely, and is bounded by CMD_BUFF_SIZE alone):
#
#   ARGC_MAX 70          -> 64-byte `i2c write`, and 32 for `spi transceive`,
#                           which is hard-capped at MIN(ARGC_MAX-2, 32) in
#                           drivers/spi/spi_shell.c. 253 is the ceiling for any
#                           of this: the `optional` count in struct
#                           shell_static_args is a uint8_t whose 0xFE/0xFF are
#                           SHELL_OPT_ARG_RAW/CHECK_SKIP (SHELL_OPT_ARG_MAX).
#   CMD_BUFF_SIZE 2304   -> 1024 payload bytes as 2048 hex characters, plus
#                           room for `bulk i2c writeread i2c1 0x50 ... 1024`.
#                           Costs 2 buffers (cmd_buff + temp_buff) per shell
#                           instance, so 4 x 2304 on MK, which runs two shells
#                           (serial + USB CDC), and 2 x 2304 on a board with
#                           one backend.
#
# The transport ring buffers that carry a command line of that size are sized
# next to the backend that owns them, in boards/<board>.conf:
# SHELL_BACKEND_SERIAL_{RX,TX}_RING_BUFFER_SIZE exist only inside
# `if SHELL_BACKEND_SERIAL` (subsys/shell/backends/Kconfig.backends), so setting
# them here would warn on an RTT-only build. The RTT backend's equivalent is
# SEGGER_RTT_BUFFER_SIZE_DOWN/_UP.
CONFIG_SHELL_ARGC_MAX=70
CONFIG_SHELL_CMD_BUFF_SIZE=2304

# argv[CONFIG_SHELL_ARGC_MAX + 1] lives on the shell thread stack (twice over:
# shell.c's execute() and tab_handle()), so ARGC_MAX 70 spends 284 bytes of the
# 2048 default. bulk_shell.c keeps its own buffers static precisely so they do
# not land here, but leave margin -- there are two of these threads.
#
# 3072 was NOT enough, and the way it failed is worth recording because nothing
# reported it. Measured on nucleo_u385rg_q over SWD with CONFIG_INIT_STACKS=y:
# after a single `flash read 0x0 16` or `i2c speed i2c1 1`, shell_rtt_stack
# (0xc00 bytes) had ZERO of its 0xAA fill left -- 100% consumed -- and live
# pointers sat at the very bottom word, i.e. execution had already run off the
# end of it.
#
# There is no CONFIG_MPU_STACK_GUARD in this build, so the overflow does not
# fault. It silently writes into whatever BSS sits below the stack, and the
# kernel panics into arch_system_halt a second or three LATER, when something
# reads the smashed structure. CFSR and HFSR are both zero -- no hardware fault
# ever happened -- so the symptom at the bench is simply a shell that stops
# answering, with a running CPU and nothing printed. It reads as a dead probe
# or a hung RTT link, which is where two bench sessions were spent before the
# stack was measured.
#
# The deep path is the printing one: shell_fprintf -> cbvprintf ->
# cbprintf_package_convert, which is what the residual frames on the thread
# stack showed. Any command that formats driver output can reach it, so this is
# not specific to one driver, one board, or the RTT backend.
#
# 8192 rather than a tighter number: the measurement above says the true
# high-water mark is somewhere past 3072 but cannot say how far past, because
# the fill was entirely gone. Re-measure with `kernel stacks` (CONFIG_INIT_STACKS
# is on) before trimming this.
CONFIG_SHELL_STACK_SIZE=8192

# Sizes buf[] in drivers/i2c/i2c_shell.c for `i2c read`/`i2c write`. The
# register address is charged against it (`i2c write` truncates when
# data_length + reg_addr_bytes > this), so a 1-byte register leaves 63.
CONFIG_I2C_SHELL_BUFFER_SIZE=64

# Shell subsystems. CONFIG_I3C_SHELL goes with I3C, in boards/<board>.conf.
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_SPI_SHELL=y
CONFIG_FLASH_SHELL=y
CONFIG_LOG_CMDS=y

# BRING-UP: display subsystem so the maxim,max7219 driver is actually built.
# Without CONFIG_DISPLAY the DT node compiles no driver at all, so nothing ever
# initialises the part and its registers stay at power-on defaults.
#
# This is shared, not MK-only: both boards carry a max7221 and both label the
# node `max7221`, which is what main.c's POST-code block keys off
# (#if DT_NODE_EXISTS(DT_NODELABEL(max7221))). MK's is on spi3 CS1 at 1 MHz,
# tt_blackhole_glx2_dmc's on spi3 CS0 at 10 MHz; SPI_DT_SPEC_GET picks up
# whichever the build has. On GLX2 that POST display is the only sign of life
# that does not go through the console, which matters when the console is RTT
# over a J-Link.
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
